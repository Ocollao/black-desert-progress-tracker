<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
  <!-- Background decoration -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-bdo-gold/5 rounded-full blur-3xl animate-float"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-bdo-gold/5 rounded-full blur-3xl animate-float" style="animation-delay: -1.5s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full">
      <svg class="w-full h-full opacity-5" viewBox="0 0 800 600" preserveAspectRatio="none">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--color-bdo-gold)" stroke-width="0.5" stroke-opacity="0.05"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"></rect>
      </svg>
    </div>
  </div>

  <div class="relative z-10 w-full max-w-md">
    <!-- BDO Logo -->
    <div class="text-center mb-10 animate-fade-in-up">
      <div class="mx-auto w-20 h-20 bg-gradient-to-br from-bdo-gold to-bdo-gold-bright rounded-2xl flex items-center justify-center shadow-bdo-gold-lg mb-6 animate-float">
        <svg class="w-12 h-12 text-bdo-text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
        </svg>
      </div>
      <h1 class="text-4xl font-bold text-gradient-gold mb-2 tracking-tight">Black Desert</h1>
      <p class="text-bdo-text-secondary text-lg">Progress Tracker</p>
    </div>

    <!-- Login Card -->
    <div class="bdo-frame p-8 animate-fade-in-up stagger-2" style="animation-delay: 100ms;">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-bdo-text-primary mb-1">Iniciar Sesión</h2>
        <p class="text-bdo-text-secondary">Accede a tu panel de progreso</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5" autocomplete="on">
        @if (error()) {
          <div class="bg-bdo-red/10 border border-bdo-red/30 text-bdo-red px-4 py-3 rounded-lg text-sm animate-fade-in-up" role="alert">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              {{ error() }}
            </div>
          </div>
        }

        <!-- Email Field -->
        <div>
          <label for="email" class="input-label">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-bdo-text-muted pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              [(ngModel)]="email"
              class="input pl-10"
              placeholder="tu@email.com"
              [class.input-error]="error() && !email()"
              autocapitalize="off"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="input-label">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-bdo-text-muted pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="8"
              [(ngModel)]="password"
              class="input pl-10"
              placeholder="••••••••"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="!isFormValid() || isLoading()"
          class="btn-primary w-full py-3.5 text-base animate-pulse-gold"
        >
          @if (isLoading()) {
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Iniciando sesión...
          } @else {
            <span class="flex items-center justify-center gap-2">
              Iniciar Sesión
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3v-1" />
              </svg>
            </span>
          }
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-bdo-border-gold/20">
        <p class="text-center text-bdo-text-secondary">
          ¿No tienes cuenta?
          <a routerLink="/register" class="text-bdo-gold hover:text-bdo-gold-bright font-medium ml-1 transition-colors">
            Regístrate
          </a>
        </p>
      </div>
    </div>

    <!-- Version info -->
    <div class="text-center mt-8 text-bdo-text-muted text-xs animate-fade-in-up stagger-6">
      <p>Black Desert Progress Tracker v0.4.3</p>
      <p class="mt-1">Hecho con <span class="text-bdo-red">♥</span> para la comunidad de BDO</p>
    </div>
  </div>
</div>
