version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bdo-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-bdo_tracker}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-bdo_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bdo-network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: bdo-backend
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bdo_tracker}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: http://localhost:4200
      BDO_DATA_DIR: /bdo-data
      PORT: 3000
    ports:
      - "3001:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - ${BDO_DATA_DIR:-C:/BDO_Data_Fixed}:/bdo-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bdo-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    container_name: bdo-frontend
    environment:
      NODE_ENV: development
    command: npm run start -- --host 0.0.0.0 --poll 2000 --proxy-config proxy.docker.conf.json
    ports:
      - "4201:4200"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bdo-network

volumes:
  postgres_data:

networks:
  bdo-network:
    driver: bridge